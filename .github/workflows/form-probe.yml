name: form-probe
on:
  push:
    paths: ['.github/workflows/form-probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://docs.google.com/forms/d/e/1FAIpQLSdyRlcj5T7KazqvC4mT6KPIM-c13neDsXk0dxXL74yjXK-IKw/viewform"
          curl -sL -A "Mozilla/5.0" "$U" -o f.html
          echo "::notice::size $(wc -c < f.html)"
          python3 -c "import re;h=open('f.html').read();m=re.search(r'FB_PUBLIC_LOAD_DATA_ = (.*?);</script>',h,re.S);print('::notice::load '+(m.group(1)[:900] if m else re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',re.sub(r'<style.*?</style>|<script.*?</script>','',h,flags=re.S)))[:300]))"
