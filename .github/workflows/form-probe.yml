name: form-probe
on:
  push:
    paths: ['.github/workflows/form-probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL "https://docs.google.com/spreadsheets/d/e/2PACX-1vRNdG6P8rWav2itwJt2z9Om7q3WNU-KBojmWOqYTMdXFb7WadSBc2rql_KJB8h1fCnurF6PAdKbkXmH/pub?gid=77904645&single=true&output=csv" -o r.csv
          echo "::notice::rows $(wc -l < r.csv) $(tail -3 r.csv | cut -c1-120 | tr '\n' '|')"
          curl -sL "https://docs.google.com/forms/d/e/1FAIpQLSdyRlcj5T7KazqvC4mT6KPIM-c13neDsXk0dxXL74yjXK-IKw/viewform" -o f.html
          echo "::notice::form $(wc -c < f.html) $(grep -oE 'entry\.[0-9]+' f.html | sort -u | tr '\n' ' ') $(grep -oE '\[[0-9]+,\"[^\"]{1,20}\",null,[0-9]' f.html | head -8 | tr '\n' ' ')"
          echo "::notice::options $(grep -oE '\[\"(새 기록|빠진 곡|틀린 정보)[^]]{0,5}' f.html | tr '\n' ' ')"
