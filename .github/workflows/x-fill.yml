# 빠진 공식 X 글 채우기 (직접 실행)
name: x-fill
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/x_fill.mjs
      - run: |
          git config user.name "숲별 기록장 봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/x_more.csv data/x_more_skip.txt data/x_photos.json
          git diff --cached --quiet && exit 0
          git commit -m "빠진 공식 X 글 채우기"
          git pull --rebase -q origin main
          git push
