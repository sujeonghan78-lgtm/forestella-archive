# 30분마다 공식 팬카페 스케줄을 확인해서 새 일정을 cafe.json에 담아요.
name: cafe-sync
on:
  schedule:
    # 하루 종일 30분마다 (깃허브가 자주 건너뛰어서 넉넉히 예약해 둬요)
    - cron: '23,53 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: '2021년 8월부터 전부 다시 가져오기'
        type: boolean
        default: false
permissions:
  contents: write
concurrency: cafe-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/cafe_sync.py ${{ inputs.full && '--full' || '' }}
      - run: |
          git diff --quiet -- cafe.json 2>/dev/null && git ls-files --error-unmatch cafe.json >/dev/null 2>&1 && exit 0
          git config user.name "숲별 기록장 봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafe.json
          git commit -m "카페 스케줄 자동 반영"
          git pull --rebase -q origin main
          git push
