name: naver-probe
on:
  push:
    branches: [naver-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36'
          u=$(curl -s -m 20 -o /dev/null -L -w '%{url_effective}' -A "$UA" "https://naver.me/xJcOEX69")
          echo "::notice title=final::$u"
          id=$(echo "$u" | grep -o 'place/[0-9]*\|pinId=[0-9]*\|/[0-9]\{6,\}' | head -1 | grep -o '[0-9]*')
          echo "::notice title=id::$id"
          h=$(curl -s -m 20 -A "$UA" "https://m.place.naver.com/place/$id/home" | grep -o '"x":"[0-9.]*","y":"[0-9.]*"\|og:title" content="[^"]*\|"roadAddress":"[^"]*' | head -3 | tr '\n' ' ')
          echo "::notice title=mplace::$h"
