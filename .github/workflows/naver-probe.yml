name: naver-probe
on:
  push:
    branches: [naver-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/naver_sync.mjs
        env:
          LINKS: "https://naver.me/xJcOEX69 https://map.naver.com/p/entry/place/11853778 https://m.place.naver.com/place/11853778/home"
      - run: |
          node -e "const j=require('./data/naver_links.json').links;for(const [u,o] of Object.entries(j)){console.log('::notice title='+o.t+'::'+u.slice(0,40)+' | '+(o.t==='folder'?o.name+' '+o.items.length+'곳 첫:'+o.items[0].name+' '+o.items[0].lat:o.t==='place'?o.name+' '+o.lat+','+o.lng+' '+o.addr:o.why))}"
