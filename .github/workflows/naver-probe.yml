name: naver-probe
on:
  push:
    branches: [naver-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36'
          q=$(python3 -c "import urllib.parse;print(urllib.parse.quote('킨텍스 제2전시장'))")
          r=$(curl -s -m 20 -A "$UA" -H 'Referer: https://map.naver.com/' "https://map.naver.com/p/api/search/allSearch?query=$q&type=all&searchCoord=127.0;37.5" | head -c 600 | tr '\n' ' ')
          echo "::notice title=allSearch::${r:0:500}"
          id=$(echo "$r" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
          echo "::notice title=id::$id"
          [ -z "$id" ] && id=13491817
          h=$(curl -s -m 20 -A "$UA" "https://m.place.naver.com/place/$id/home" | grep -o '"x":"[0-9.]*","y":"[0-9.]*"\|"latitude":[0-9.]*\|"longitude":[0-9.]*\|og:title" content="[^"]*' | head -4 | tr '\n' ' ')
          echo "::notice title=mplace::$h"
          s=$(curl -s -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' -A "$UA" "https://naver.me/")
          echo "::notice title=naverme::$s"
          s2=$(curl -s -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' -A "$UA" "https://map.naver.com/p/entry/place/$id")
          echo "::notice title=entry::$s2"
