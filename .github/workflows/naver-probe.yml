name: naver-probe
on:
  push:
    branches: [naver-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36'
          S=49e7297a5df544bd9ce013d6e02af949
          for u in "https://pages.map.naver.com/save-pages/api/maps-bookmark/v3/shares/$S/bookmarks?start=0&limit=5000&sort=lastUseTime" "https://pages.map.naver.com/save-pages/api/maps-bookmark/v3/shares/$S"; do
            r=$(curl -s -m 20 -A "$UA" -H "Referer: https://pages.map.naver.com/save-pages/web/detail-list/$S" "$u" | tr '\n' ' ')
            echo "::notice title=api::${#r} ${r:0:900}"
          done
          r=$(curl -s -m 20 -A "$UA" "https://pages.map.naver.com/save-pages/api/maps-bookmark/v3/shares/$S/bookmarks?start=0&limit=5000&sort=lastUseTime")
          echo "$r" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin); bs=d.get('bookmarkList') or d.get('bookmarks') or []
            print('::notice title=count::',len(bs), list(d.keys()))
            for b in bs[:8]: print('::notice title=b::', b.get('name'), b.get('px'), b.get('py'), b.get('address'), b.get('memo'))
          except Exception as e: print('::notice title=err::',e)
          "
