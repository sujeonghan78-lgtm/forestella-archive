# 임시: 카페 일정 게시판이 어떤 모양인지 확인용 (확인 끝나면 지워요)
name: cafe-probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/cafe-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p probe && cd probe
          M="Mozilla/5.0 (Linux; Android 13; SM-S911N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          P="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          curl -sSL -A "$M" -o m_list.html -w "m %{http_code}\n" "https://m.cafe.daum.net/official.forestella/XkhA?boardType=Q" || true
          curl -sSL -A "$P" -o pc_list.html -w "pc %{http_code}\n" "https://cafe.daum.net/official.forestella/XkhA" || true
          ls -la
          for f in m_list.html pc_list.html; do
            echo "::notice title=$f size::$(wc -c < $f) bytes / title: $(grep -o '<title>[^<]*' $f | head -1)"
            echo "::notice title=$f classes::$(grep -o 'class=\"[^\"]*\"' $f | sort | uniq -c | sort -rn | head -40 | tr '\n' ' ')"
            echo "::notice title=$f links::$(grep -o 'href=\"[^\"]*XkhA[^\"]*\"' $f | head -15 | tr '\n' ' ')"
            echo "::notice title=$f scripts::$(grep -o 'src=\"[^\"]*\.js[^\"]*\"' $f | head -15 | tr '\n' ' ')"
            echo "::notice title=$f hints::$(grep -o -i '[a-z_]*\(api\|article\|dataid\|fldid\|grpid\|frame\|iframe\)[^ <>]\{0,60\}' $f | sort -u | head -40 | tr '\n' ' ')"
          done
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe, retention-days: 1 }
