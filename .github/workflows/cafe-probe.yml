# 임시: 카페 일정 게시판이 어떤 모양인지 확인용 (확인 끝나면 지워요)
name: cafe-probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/cafe-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p probe && cd probe
          M="Mozilla/5.0 (Linux; Android 13; SM-S911N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          P="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          curl -sSL -A "$M" -o m_list.html -w "m %{http_code}\n" "https://m.cafe.daum.net/official.forestella/XkhA?boardType=Q" || true
          curl -sSL -A "$P" -o pc_list.html -w "pc %{http_code}\n" "https://cafe.daum.net/official.forestella/XkhA" || true
          ls -la
          curl -sS -G -A "$M" -H "Accept: application/json" -H "Referer: https://m.cafe.daum.net/official.forestella/XkhA?boardType=Q" -o api.json -w "api %{http_code}\n" "https://m.cafe.daum.net/official.forestella/XkhA/schedule" --data-urlencode "startTime=2026-10-01T00:00:00+09:00" --data-urlencode "endTime=2026-10-31T23:59:59+09:00" || true
          python3 - <<'PY'
          import json
          raw=open('api.json',encoding='utf-8',errors='replace').read()
          print('::notice title=api raw::'+raw[:400].replace('%','%25').replace('\n',' '))
          try:
            d=json.loads(raw); L=d['data']['scheduleList']
            print('::notice title=api count::%d keys=%s'%(len(L), sorted(L[0].keys()) if L else ''))
            for x in L[:4]:
              y={k:v for k,v in x.items() if k not in ('description','image')}
              print('::notice title=api item::'+json.dumps(y,ensure_ascii=False)[:1500].replace('%','%25'))
          except Exception as e: print('::notice title=api err::'+repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe, retention-days: 1 }
