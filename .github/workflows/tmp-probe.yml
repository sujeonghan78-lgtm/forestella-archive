name: tmp-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p probe
          curl -s -L -A "Mozilla/5.0" -o probe/kopis.html "https://www.kopis.or.kr/por/db/pblprfr/pblprfr.do?menuId=MNU_00020"
          for f in $(grep -oE 'src="[^"]*\.js[^"]*"' probe/kopis.html | sed 's/src="//;s/"$//' | grep -v http | head -20); do n=$(echo $f | tr '/?' '__'); curl -s -L -A "Mozilla/5.0" -o "probe/$n" "https://www.kopis.or.kr$f"; done
          git config user.name bot; git config user.email bot@x
          git checkout -b tmp-probe; git add probe; git commit -qm probe; git push -f origin tmp-probe
