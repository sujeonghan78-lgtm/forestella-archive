# 포레스텔라 공식 유튜브 영상 목록 받아오기 (매일 + 직접 실행)
name: yt-sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/yt_sync.mjs 2>err.txt || { echo "::error::$(grep -m3 -i 'error' err.txt | tr '\n' ' ' | cut -c1-400)"; exit 1; }
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: |
          git config user.name "숲별 기록장 봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yt_videos.json
          git diff --cached --quiet && exit 0
          git commit -m "공식 유튜브 영상 목록 업데이트"
          git pull --rebase -q origin main
          git push
