# 유튜브 뮤직 공식 음원 목록 받기 (매주 + 직접 실행)
name: ytm-tracks
on:
  workflow_dispatch:
  schedule:
    - cron: '50 21 * * 1'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/ytm_tracks.mjs 2>err.txt || { echo "::error::$(grep -m3 -i 'error' err.txt | tr '\n' ' ' | cut -c1-400)"; exit 1; }
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: node tools/ytm_links.mjs
      - run: |
          git config user.name "숲별 기록장 봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ytm_tracks.json data/ytm_links.json
          git diff --cached --quiet && exit 0
          git commit -m "유튜브 뮤직 음원 목록 업데이트"
          git pull --rebase -q origin main
          git push
