# 공식 X 글 속 t.co 주소를 원래 주소로 풀기 (직접 실행)
name: x-links
on: workflow_dispatch
permissions:
  contents: write
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/x_links.mjs
      - run: |
          git config user.name "숲별 기록장 봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/x_links.json
          git diff --cached --quiet && exit 0
          git commit -m "공식 X 글 링크 풀기"
          git pull --rebase -q origin main
          git push
