# 유튜브 영상 조회수 하루 한 번 저장 (매일 + 직접 실행)
name: yt-views
on:
  workflow_dispatch:
  schedule:
    - cron: '7 20 * * *'
permissions:
  contents: write
jobs:
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/yt_views.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: |
          git config user.name "숲별 기록장 봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yt_views.json data/yt_views_hist.json
          git diff --cached --quiet && exit 0
          git commit -m "유튜브 조회수 업데이트"
          git pull --rebase -q origin main
          git push
