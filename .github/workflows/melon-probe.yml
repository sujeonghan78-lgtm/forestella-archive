name: melon-probe
on:
  push:
    paths: ['.github/workflows/melon-probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1"
          curl -sL -A "$UA" -w '%{url_effective}\n' "https://www.melon.com/artist/album.htm?artistId=2111354" -o a.html | while read u; do echo "::notice::redirect $u"; done
          echo "::notice::a bytes $(wc -c < a.html)"
          grep -oE '.{70}(albumId|AlbumDetail|album_no|albumNo)[^0-9]{0,8}[0-9]{8}.{30}' a.html | head -5 | while read l; do echo "::notice::A $(echo "$l" | cut -c1-220)"; done
          grep -oE '"/[a-z/]*album[A-Za-z/]*\.(htm|json)[^"]*' a.html | sort -u | head -8 | while read l; do echo "::notice::U $l"; done
          curl -sL -A "$UA" -w '%{url_effective}\n' "https://m.melon.com/album/music.htm?albumId=14447806" -o c.html | while read u; do echo "::notice::det $u"; done
          echo "::notice::c bytes $(wc -c < c.html)"
          grep -oE '.{0,60}(title|tit|song)[^>]{0,40}>[^<]{2,40}<' c.html | head -8 | while read l; do echo "::notice::C $(echo "$l" | tr -d '\t\r' | cut -c1-200)"; done
