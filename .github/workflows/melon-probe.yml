name: melon-probe
on:
  push:
    paths: ['.github/workflows/melon-probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120 Safari/537.36"
          for i in 14534970 11750921 11651292 11573241 11428885 11227000 11198156 10801580 10751711 10655790 10587619 10509857 10487435 10388461 10224682 2202808 1145454; do
            u=$(curl -sL -A "$UA" "https://www.melon.com/album/detail.htm?albumId=$i" | grep -oE 'og:image" content="[^"]+' | head -1 | sed 's/.*content="//; s/?.*//')
            curl -sL -A "$UA" "$u" -o covers/melon-$i.jpg || true
            echo "::notice::$i $(wc -c < covers/melon-$i.jpg)"
          done
          sudo apt-get -qq install -y imagemagick >/dev/null 2>&1 || true
          for f in covers/melon-*.jpg; do convert "$f" -resize '320x320>' -strip -quality 82 "$f" || true; done
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add covers; git commit -m "Add Melon member album covers" && git push
