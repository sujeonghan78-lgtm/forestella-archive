name: melon-probe
on:
  push:
    paths: ['.github/workflows/melon-probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > m.py <<'P'
          import urllib.request,re,html
          h0=urllib.request.urlopen(urllib.request.Request('https://www.melon.com/album/detail.htm?albumId=10166204',headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120 Safari/537.36'})).read().decode('utf8','ignore')
          k=h0.find('rank01');print('::notice::LEN '+str(len(h0))+' '+re.sub(r'\s+',' ',h0[max(0,k-1500):k+900]).replace('<','[').replace('>',']'))
          ids='13983568 12938230 11427272 11348862 10900320 10765361 10592215 10581472 10561993 10557971 10510230 10444175 10425213 10402991 10306641 10286739 10166204 10539211 10455427 10326788 10251953 10221039 10211847 10195348 10894234 10890034'.split()
          out=[]
          for i in ids:
            h=urllib.request.urlopen(urllib.request.Request('https://www.melon.com/album/detail.htm?albumId='+i,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120 Safari/537.36'})).read().decode('utf8','ignore')
            rows=re.findall(r'<tr[^>]*>(.*?)</tr>',h,re.S)
            t=[]
            for r in rows:
              a=re.search(r'class="ellipsis rank01".*?<a[^>]*>(.*?)</a>|class="ellipsis rank01".*?<span[^>]*>(.*?)</span>',r,re.S)
              b=re.search(r'class="ellipsis rank02".*?<a[^>]*>(.*?)</a>',r,re.S)
              if a:
                nm=html.unescape(re.sub('<[^>]+>','',a.group(1) or a.group(2) or '')).strip()
                ar=html.unescape(re.sub('<[^>]+>','',b.group(1))).strip() if b else ''
                t.append(nm+' ('+ar+')')
            f=[x for x in t if '포레스텔라' in x or '배두훈' in x or '강형호' in x or '조민규' in x or '고우림' in x]
            out.append(i+': '+str(len(t))+' / '+' / '.join(f))
          print('::notice::'+' ;; '.join(out))
          P
          python3 m.py
