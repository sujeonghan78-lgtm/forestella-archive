name: melon-probe
on:
  push:
    paths: ['.github/workflows/melon-probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120 Safari/537.36"
          for i in 13983568 12938230 11427272 11348862 10900320 10765361 10592215 10581472 10561993 10557971 10510230 10444175 10425213 10402991 10306641 10286739 10166204 10539211 10455427 10326788 10251953 10221039 10211847 10195348; do
            u=$(curl -sL -A "$UA" "https://www.melon.com/album/detail.htm?albumId=$i" | grep -oE 'og:image" content="[^"]+' | head -1 | sed 's/.*content="//; s/?.*//')
            curl -sL -A "$UA" "$u?type=w400" -o covers/melon-$i.jpg || true
            echo "$i $(wc -c < covers/melon-$i.jpg)"
          done
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add covers; git commit -m "Add Melon omnibus covers" && git push
