# 보관함 Apps Script 연결 확인 (확인 후 지워요)
name: box-probe
on:
  push:
    paths: ['.github/workflows/box-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://script.google.com/macros/s/AKfycbwYlE1fytf4V0tpm9HkRHvGZqA7Pnv6YwwM2Cek6cKHPFg_RpxCev9vhv8ZdBF3e5Fkfg/exec'
          R=$(curl -sS -L -m 30 -X POST -H 'Content-Type: text/plain;charset=utf-8' -H 'Origin: https://sujeonghan78-lgtm.github.io' -D h.txt --data '{"action":"load","name":"zz연결확인zz","pin":"0000"}' "$U")
          echo "::notice::body ${R:0:200}"
          echo "::notice::acao $(grep -i 'access-control-allow-origin' h.txt | tr -d '\r' | tr '\n' ' ')"
