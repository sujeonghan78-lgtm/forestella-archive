# 제보 폼 칸 번호 확인 (직접 실행)
name: form-entries
on: workflow_dispatch
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL 'https://docs.google.com/forms/d/e/1FAIpQLSdyRlcj5T7KazqvC4mT6KPIM-c13neDsXk0dxXL74yjXK-IKw/viewform' -o f.html
          echo "::notice::size $(wc -c < f.html) title $(grep -o '<title>[^<]*' f.html | head -1)"
          grep -oE 'FB_PUBLIC_LOAD_DATA_[^;]{0,3000}' f.html | grep -oE '\[[0-9]{6,12},\"[^"]{0,40}\"|"[^"]{1,20}",null,[0-9],\[\[[0-9]{6,12}' | head -20 | sed 's/^/::notice::/'
          grep -oE '\[[0-9]{6,12},null,[01]' f.html | head -20 | sed 's/^/::notice::/'
